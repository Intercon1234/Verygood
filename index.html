<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verygood Submission Proxy</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; }
        form { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h3 { margin-top: 0; color: #333; }
        label { font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input, button { width: 100%; padding: 10px; margin: 6px 0 12px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #0088cc; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #006699; }
    </style>
</head>
<body>

    <form action="/api/proxy" method="POST">
        <h3>Submit to Telegram</h3>
        
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
        
        <label for="email">Email Address:</label>
        <!-- type="email" strictly forces validation for signs and domains -->
        <input type="email" id="email" name="email" placeholder="test@mail.com" required>
        
        <label for="message">Message:</label>
        <input type="text" id="message" name="message" placeholder="Type something..." required>
        
        <button type="submit">Send to Telegram</button>
    </form>

</body>
</html>
