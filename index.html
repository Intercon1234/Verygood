<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Decoded Website</title>
</head>
<body>
    <div id="app"></div>

    <script>
        // Your content is placed safely inside the backticks below
        const encodedContent = `
        <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f3f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Preloader */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spinner {
            position: relative;
            width: 20px;
            height: 20px;
        }
        .spinner div {
            width: 8px;
            height: 8px;
            background-color: #005da6;
            border-radius: 50%;
            position: absolute;
            animation: move 1.2s infinite ease-in-out;
        }
        .spinner div:nth-child(2) { animation-delay: 0.15s; }
        .spinner div:nth-child(3) { animation-delay: 0.3s; }
        @keyframes move {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Login box */
        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            display: block; 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Hover animation */
        .login-box:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 120, 212, 0.4);
        }

        /* Back arrow */
        .backButton {
            position: absolute;
            top: 3rem;
            left: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 70px;
        }

        /* Logo */
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1rem;
            margin-top: 1.5rem;
        }
        .logo img { height: 24px; }
        .logo span { font-size: 1.1rem; color: #555; font-weight: 500; }

        /* Email pill */
        .email-pill {
            padding: 0.4rem 1.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin: 0 auto 0.5rem;
            width: fit-content;
            text-align: center;
            border: 1px solid #ccc;
        }
        </style>

        <div id="preloader">
            <div class="spinner">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>

        <div class="login-box">
            <div class="logo">
                <span>Sign In</span>
            </div>
            <div class="email-pill">user@example.com</div>
        </div>
        `;

        // This script automatically decodes and renders the content when opened
        const txt = document.createElement("textarea");
        txt.innerHTML = encodedContent;
        document.getElementById("app").innerHTML = txt.value;

        // FIXED: Using valid JS comments (//) instead of Python hash comments (#)
        setTimeout(() => {
            const preloader = document.getElementById('preloader');
            if(preloader) preloader.style.display = 'none';
        }, 1000);
    </script>
</body>
</html>
